# =============================================================================
# POST-CHECK RULE SETTINGS
# =============================================================================
#
# THIS IS THE SOURCE OF TRUTH for every threshold and checklist the rules use.
# Editing this file changes what "Đạt" means - no Python change required.
#
# `type_id` must exist in src/agents/documents/document_matrix.yaml; the loader
# checks that on load and names the offending id. Those ids keep their original
# spelling because that file is copied verbatim from SME_creditmemo.
#
# Places the business must still fill in are marked TODO.

version: 1

defaults:
  # BRD 2.4: "chênh lệch quá 40%"
  variance_threshold_pct: 40

  # BRD 2.3.a: booked before 30 April -> use year N-2 statements, else N-1
  financials_cutoff_mmdd: "04-30"

  # BRD 2.3.b / 2.3.c: 100% is the CCR of a facility with no unsecured benefit
  unsecured_ccr_pct: 100

  # BRD 2.3.c: below 100% CCR the collateral must be a vehicle or real estate
  secured_collateral_types: ["PTVT", "BDS"]

  # BRD 2.3.a: "Word/excel/pdf/xml"
  allowed_extensions: [".pdf", ".doc", ".docx", ".xls", ".xlsx", ".xml",
                     ".jpg", ".jpeg", ".png"]

  # BRD 2.3.a: total assets must equal total capital. Zero tolerance - a
  # balance sheet out by one dong is a balance sheet that does not balance.
  balance_tolerance_vnd: 0

  # BRD 2.4: from this group upwards counts as "nợ cần chú ý, nợ có vấn đề"
  debt_group_warning_threshold: 2

  # BRD 2.4: "Số lần phát sinh PDLD" - PDLD is Payment due LD, an overdue
  # disbursement, so this is a CEILING and 0 means zero tolerance.
  max_pdld_count: 0

  # Expanded before addresses are compared (V03, F01)
  address_abbreviations:
    tp: "thanh pho"
    tt: "thi tran"
    tx: "thi xa"
    q: "quan"
    h: "huyen"
    p: "phuong"
    x: "xa"
    kp: "khu pho"
    d: "duong"

# CIC prints the debt group as free text. Matched after normalize_text, so no
# diacritics here. A label absent from this table leaves the fact missing with
# the string it read - it is never guessed as group 1.
debt_group_by_label:
  "no du tieu chuan": 1
  "no can chu y": 2
  "no duoi tieu chuan": 3
  "no nghi ngo": 4
  "no co kha nang mat von": 5

# V10: what each persona's site-visit photos should show, and how many of those
# markers must appear across the WHOLE photo set. The union of every `expected`
# list is the closed vocabulary the vision prompt is given - deliberately the
# whole union and not the customer's own list, so the model is never told which
# persona it is being asked to confirm.
# TODO - business to confirm the personas, their markers and each threshold.
persona_evidence:
  "san xuat":
    min_markers: 2
    expected: ["nha xuong", "nha kho", "cong nhan", "may moc", "day chuyen san xuat"]
  "thuong mai":
    min_markers: 1
    expected: ["cua hang", "hang hoa tren ke", "kho hang", "quay giao dich"]
  "dich vu":
    min_markers: 1
    expected: ["van phong", "quay le tan", "nhan vien lam viec", "bien hieu"]
  "ban buon":
    min_markers: 1
    expected: ["kho hang", "hang hoa dong kien", "xe tai", "khu boc xep"]

# V09: what kind of financial report this is. Both sides print their own wording
# - the RM types one thing into LOS, the document says another - so each is
# normalised (lowercase, no diacritics) and looked up here. A wording absent from
# this table leaves the fact MISSING; it is never guessed into a kind.
# TODO - business to confirm the full vocabulary and its wordings.
financial_report_types:
  "bao cao thue": "Báo cáo thuế"
  "bctc thue": "Báo cáo thuế"
  "bo bao cao tai chinh (b01a - dnn)(tt133/2016/tt-btc)": "Báo cáo thuế"
  "bao cao kiem toan": "Báo cáo kiểm toán"
  "bctc kiem toan": "Báo cáo kiểm toán"
  "bctc rieng le": "BCTC riêng lẻ"
  "bctc hop nhat": "BCTC hợp nhất"

# BRD 2.3.b: the industries the bank is focusing on. An industry NOT listed here
# is off-focus, and an off-focus industry forces CCR to 100%.
# TODO - business to supply the full list of GSO codes.
focus_GSO:
  - "4711"
  - "6810"
  -

# BRD 2.3.b: the industries credit is RESTRICTED for. Different consequence from
# focus_GSO: being outside focus_GSO means CCR must be 100%, while being inside
# this list means the facility should not have been granted at all - so C02 fails
# regardless of CCR. An empty list is valid and means nothing is restricted yet.
# TODO - business to supply the full list of GSO codes.
restricted_GSO: []

# Cue words that mark personal data, for masking before anything is sent to a
# model. Every pattern needs a cue: masking every 9-12 digit run swallows the tax
# code and every figure on the balance sheet instead.
# Matching ignores diacritics, so one entry catches the OCR variants too - "Ong"
# also matches "Ông", "Giam doc" also matches "Giảm đắc".
pii_person_cues:
  - "Ông"
  - "Bà"
  - "Giám đốc"
  - "Tổng Giám đốc"
  - "Kế toán trưởng"
  - "Người lập"
  - "Người lập biểu"
  - "Chủ tịch"
  - "Đại diện"
  - "Người đại diện"
  - "Kiểm toán viên"

# Vietnamese names open with a small closed set of surnames. Measured on a real
# statement: cue words alone caught 6 of 16 name occurrences - the rest sit in
# signature blocks with no cue in front of them.
pii_surnames:
  - "Nguyễn"
  - "Trần"
  - "Lê"
  - "Phạm"
  - "Hoàng"
  - "Huỳnh"
  - "Phan"
  - "Vũ"
  - "Võ"
  - "Đặng"
  - "Bùi"
  - "Đỗ"
  - "Hồ"
  - "Ngô"
  - "Dương"
  - "Lý"
  - "Đào"
  - "Đoàn"
  - "Vương"
  - "Trịnh"
  - "Đinh"
  - "Lâm"
  - "Mai"
  - "Tạ"
  - "Chu"
  - "Kiều"
  - "Cao"
  - "Thái"
  - "Lưu"
  - "Hà"

pii_identifier_cues:
  - "CCCD"
  - "CMND"
  - "Căn cước công dân"
  - "Căn cước"
  - "Chứng minh nhân dân"
  - "Số CCCD"
  - "Số CMND"

pii_contact_cues:
  - "Điện thoại"
  - "ĐT"
  - "SĐT"
  - "Tel"
  - "Mobile"
  - "Email"

